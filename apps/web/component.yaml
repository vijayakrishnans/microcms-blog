apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The microCMS-backed blog with drafts, tags and search (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # No dependsOn: the blog reads no wiring and binds nothing, so there is no
  # infra component to deploy before it. A component under infra/ that this
  # Worker comes to read wiring from goes here, `mode: enforced` with a
  # `modeRules` entry making it advisory on github-pull-request, so one
  # convergence applies it first.
  #
  # microCMS, which the owner connects after the bootstrap: the service id and
  # its API key, stored per environment as the product's secrets
  # MICROCMS_SERVICE_DOMAIN and MICROCMS_API_KEY (README → Connect microCMS).
  # They reach the Worker as SECRETS at deploy (buildCommand below) and every
  # page reads them per request (libs/microcms.ts) — never the build. Optional:
  # one not stored yet is skipped when the job resolves its secrets (no env var,
  # no failure), and the blog then renders its sample posts under a notice that
  # says how to connect, so a fresh product deploys and serves before its owner
  # has a service at all.
  optionalSecretEnv:
    MICROCMS_SERVICE_DOMAIN: "secret://microcms-blog/microcms-blog/{{ .environment }}/MICROCMS_SERVICE_DOMAIN"
    MICROCMS_API_KEY: "secret://microcms-blog/microcms-blog/{{ .environment }}/MICROCMS_API_KEY"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  # How the site runs itself for orun.work's live Preview tab
  # (saas-parallel-baselining PB4): `orun preview` starts this, and a coding
  # session keeps it running while it works, so the person watches it change
  # as it is built. The dev server binds the box's loopback only, on a fixed
  # port, and installs first, so a checkout the session has not installed yet
  # still comes up.
  # No microCMS service is connected here (its id and key are Orun secrets,
  # and nothing secret goes in env), so the blog renders its sample posts.
  preview:
    run:
      - sh
      - -c
      - pnpm install --frozen-lockfile --prefer-offline --filter "@app/web..." && exec node_modules/.bin/next dev -H 127.0.0.1 -p 3000
    port: 3000
    path: /
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: microcms-blog-web-{dev,stage,prod}.
    workerName: microcms-blog-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: vijayakrishnan12994

    installCommand: pnpm install --frozen-lockfile
    # The site's public origin (BASE_URL, the template's own variable, inlined
    # by next.config.js for metadataBase): the environment's SITE_URL when
    # intent.yaml sets one (a custom domain), else its workers.dev URL. The
    # subdomain is written out rather than read from ${WORKERS_DEV_SUBDOMAIN}:
    # the composition exports that to the smoke step only, so the build would
    # see it empty. ${ORUN_ENVIRONMENT} the runner sets for every step.
    #
    # The microCMS secrets are UNSET for the build (`env -u`), so no bundle can
    # carry them, and go to the Worker as SECRETS after it
    # (tooling/wire/worker-secrets.mjs: `wrangler secret bulk` over stdin; a
    # verify lane holds no Cloudflare credential and pushes nothing). A secret
    # changed later reaches the Worker on the next deploy.
    buildCommand: env -u MICROCMS_SERVICE_DOMAIN -u MICROCMS_API_KEY BASE_URL="${SITE_URL:-https://microcms-blog-web-${ORUN_ENVIRONMENT}.vijayakrishnan12994.workers.dev}" pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret MICROCMS_SERVICE_DOMAIN --secret MICROCMS_API_KEY --worker "microcms-blog-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the home page renders the blog — its footer's "All Rights
    # Reserved", there whether it shows the sample posts or the owner's, and
    # not the blog's name, which is the owner's to change and HTML-escaped when
    # it carries an `&` or `'` — and an article that does not exist is a 404,
    # an answer only the Worker's server code gives (it asks microCMS, or the
    # samples, and renders the template's not-found page). The page is buffered
    # before grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'All Rights Reserved' && test \"$(curl -s -o /dev/null -w '%{http_code}' \"${DEPLOYED_URL}/blogs/orun-smoke-no-such-post\")\" = 404"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
